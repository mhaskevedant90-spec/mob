name: Build Minecraft Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Mod JAR
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'
      
      - name: Run Build
        run: gradle build

      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: mobfusion-mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
